<!DOCTYPE html>
<html>
<head>
    <title>Update Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 20px 40px;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Teacher Panel</h1>
    </div>

    <div class="container">

        <h2>Update Student Performance</h2>

        <p><strong>Student:</strong> {{ student.name }}</p>
        <p><strong>Roll No:</strong> {{ student.roll_no }}</p>

        <form method="POST">

            <label>Attendance (%)</label>
            <input
                type="number"
                name="attendance"
                value="{{ student.attendance }}"
                min="0"
                max="100"
                step="0.01"
                required
            >

            <label>Internal Marks</label>
            <input
                type="number"
                name="internal_marks"
                value="{{ student.internal_marks }}"
                min="0"
                max="100"
                step="0.01"
                required
            >

            <label>Exam Marks</label>
            <input
                type="number"
                name="exam_marks"
                value="{{ student.exam_marks }}"
                min="0"
                max="100"
                step="0.01"
                required
            >

            <button type="submit">
                Save Changes
            </button>

        </form>

        <a href="/teacher/dashboard" class="back">
            ← Back to Teacher Dashboard
        </a>

    </div>

</body>
</html>
