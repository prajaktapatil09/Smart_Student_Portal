<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
</head>

<body>

<h1>Add Student</h1>

<form action="/add_student" method="POST">

    <input type="text" name="name" placeholder="Student Name" required>
    <br><br>

    <input type="text" name="roll_no" placeholder="Roll Number" required>
    <br><br>

    <input type="text" name="student_class" placeholder="Class" required>
    <br><br>

    <input type="text" name="department" placeholder="Department" required>
    <br><br>

    <input type="email" name="email" placeholder="Email">
    <br><br>

    <input type="text" name="phone" placeholder="Phone">
    <br><br>

    <input type="number" name="attendance" placeholder="Attendance %">
    <br><br>

    <input type="number" name="internal_marks" placeholder="Internal Marks">
    <br><br>

    <input type="number" name="exam_marks" placeholder="Exam Marks">
    <br><br>

    <button type="submit">Save Student</button>

</form>

</body>
</html>
